version: 2.1

# Prompt 002D: CircleCI is not the M04 disk-image authority (osbuild mount blocker).
# Heavy job definition is retained for history/diagnostics but cannot run.
# See docs/versions/v0.1/CIRCLECI-M04-BLOCKER.md and ADR-0003.

parameters:
  run_m04:
    type: boolean
    default: false

jobs:
  m04-cloud-build:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    environment:
      RAVEN_CLOUD_BUILDER: "1"
    steps:
      - checkout
      - run:
          name: Heavy M04 path disabled
          command: |
            echo "CircleCI heavy M04 is disabled (Prompt 002D / ADR-0003)."
            echo "Do not retry osbuild/QCOW2 on this executor."
            exit 1

workflows:
  m04-manual:
    when: false
    jobs:
      - m04-cloud-build
