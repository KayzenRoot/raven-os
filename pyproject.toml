[project]
name = "raven-os"
version = "0.1.0"
description = "Raven OS V0.1 — repository bootstrap and quality harness (VM Cognitive Seed foundation)"
readme = "AGENTS.md"
requires-python = ">=3.12"
# Minimum Python 3.12: matches current executor toolchain and remains compatible with
# Fedora 44's Python 3.13 runtime without unnecessarily blocking later migration.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/raven_core",
    "src/raven_ui",
    "src/raven_adapters",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
mypy_path = "src"
files = ["src", "scripts", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
